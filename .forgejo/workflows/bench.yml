name: bench

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the gate when the override label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Excludes the crates the gated benches cannot link rather than listing
    # the ones they do: a new dependency of felis-daemon or felis-client-core
    # then still runs the gate instead of silently skipping it.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!crates/felis-shaping/**'
      - '!crates/felis-render-core/**'
      - '!crates/felis-render-wgpu/**'
      - '!crates/felis-client/**'
      - '!crates/felis-cli/**'
      - '!tests/**'
      - '!nix/**'
      - '!skills/**'
      - '!.agents/**'
      - '!tools/**'
      - '!.forgejo/**'
      - 'tools/bench/**'
      - '.forgejo/workflows/bench.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: instruction-count regression gate
    runs-on: x86_64-linux
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/cargo-env

      # Re-benches the base commit in-job: Forgejo caches are per-runner, so
      # baselines cannot be shared across runners. The PR's own script drives
      # both runs, so a fix to the gate can pass the gate.
      - name: compare instruction counts with the base
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: nix develop -c python3 tools/bench/gungraun.py gate --base "${{ github.event.pull_request.base.sha }}"
      - uses: ./.forgejo/actions/cargo-env/done
        if: always()
