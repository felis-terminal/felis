name: fuzz

on:
  pull_request:
    branches: [main]
    # Excludes the crates the fuzz targets cannot link rather than listing
    # the ones they do, so a new dependency still runs the smoke.
    paths: &fuzz-paths
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!crates/felis-shaping/**'
      - '!crates/felis-render-wgpu/**'
      - '!crates/felis-client/**'
      - '!crates/felis-cli/**'
      - '!crates/felis-daemon/**'
      - '!crates/felis-pty/**'
      - '!tests/**'
      - '!nix/**'
      - '!skills/**'
      - '!.agents/**'
      - '!tools/**'
      - '!.forgejo/**'
      - '.forgejo/workflows/fuzz.yml'
  push:
    branches: [main]
    paths: *fuzz-paths
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Superseding a PR commit cancels its runs; main's runs never cancel, since
# publication is gated per revision on that revision's own jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: cargo fuzz smoke (per target)
    runs-on: x86_64-linux
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read-only: a PR's targets may differ from main's, so what they find
      # is not written back.
      - name: start from the nightly corpus
        run: |
          root="$HOME/.cache/forgejo-ci/${{ github.repository }}/fuzz-corpus"
          mkdir -p "$root" fuzz/corpus
          flock "$root.lock" cp -a "$root/." fuzz/corpus/
      - name: smoke every target (seed corpus + 10k runs each)
        # Shares libFuzzer flags with local runs via justfile to prevent divergence.
        run: nix develop -c just fuzz-smoke

  nightly:
    name: cargo fuzz nightly long-run
    runs-on: x86_64-linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A host directory rather than actions/cache, for the reason in
      # .forgejo/actions/cargo-env.
      - name: resume from the previous night's corpus
        run: |
          root="$HOME/.cache/forgejo-ci/${{ github.repository }}/fuzz-corpus"
          mkdir -p "$root" fuzz/corpus
          flock "$root.lock" cp -a "$root/." fuzz/corpus/
      - name: long-run + minify each target
        run: nix develop -c just fuzz-long
      - name: keep the minified corpus for the next night
        run: |
          root="$HOME/.cache/forgejo-ci/${{ github.repository }}/fuzz-corpus"
          (
            flock 9
            rm -rf "${root:?}.new"
            cp -a fuzz/corpus "$root.new"
            rm -rf "${root:?}"
            mv "$root.new" "$root"
          ) 9>"$root.lock"
