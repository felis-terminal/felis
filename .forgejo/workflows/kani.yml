# Catches drift in #[cfg(kani)] proof harnesses, which do not compile under regular test or clippy.
name: kani

on:
  # A Kani bump changes the verifier under every proof, so it is checked
  # before it lands rather than by the next weekly run.
  pull_request:
    paths:
      - 'dev/packages/kani/**'
      - '.forgejo/workflows/kani.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Superseding a PR commit cancels its run; on main the group serializes a
# manual dispatch against the weekly cron so two proof runs cannot overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    name: cargo kani (vt + protocol + grid + client-core kernels)
    runs-on: x86_64-linux
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: nix develop -c just kani
