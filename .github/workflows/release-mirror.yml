# The only GitHub workflow: releases are built and gated on Forgejo
# (.forgejo/workflows/release.yml), and this republishes the finished Forgejo
# release on the mirror once the push mirror delivers the tag, then asks the
# Homebrew tap to follow it.
name: release-mirror

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-mirror-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # The Forgejo release gate takes hours; the script's own deadline expires first.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/release/mirror.py --self-test
      - run: python3 tools/release/mirror.py "$GITHUB_REF_NAME"
        env:
          MIRROR_SOURCE: https://git.natsukium.com/api/v1/repos/felis-terminal/felis
          MIRROR_TIMEOUT: "18000"
          GH_TOKEN: ${{ github.token }}

  # After `mirror`, which waits for the published Forgejo release, so only a
  # tag that passed the Forgejo gate publishes. A candidate is skipped: its
  # manifests already carry the final version.
  crates:
    needs: mirror
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Each crate's trusted publisher names this environment, so no other job
    # can mint a crates.io token.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/release/crates.py --self-test
      - name: list the crates whose version is not on crates.io
        id: plan
        run: |
          plan=$(python3 tools/release/crates.py publish-plan)
          packages=""
          for crate in $plan; do packages="$packages -p $crate"; done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
        if: steps.plan.outputs.packages != ''
      # Verification builds run package code, so they finish before a token exists.
      - run: cargo publish --dry-run ${{ steps.plan.outputs.packages }}
        if: steps.plan.outputs.packages != ''
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.plan.outputs.packages != ''
      - run: cargo publish --no-verify ${{ steps.plan.outputs.packages }}
        if: steps.plan.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew:
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packaging diff reaches back to the previous release tag.
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/release/homebrew.py --self-test
      - run: python3 tools/release/homebrew.py "$GITHUB_REF_NAME"
        env:
          HOMEBREW_TAP: felis-terminal/homebrew-tap
          # github.token cannot write to another repository, and a pull request
          # it opened would start no workflow there.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
