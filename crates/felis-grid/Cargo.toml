[package]
name = "felis-grid"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis grid model: cells, cursor, scrollback, image store, damage tracker"

[features]
# Derives the row DTO's JSON Schema for the documents that embed it;
# default-off so the shipped binaries stay schemars-free.
schema = ["dep:schemars"]
# Serde for the state an in-place daemon upgrade carries across exec;
# only the daemon enables it.
state-dump = ["felis-vt/state-dump"]

[dependencies]
felis-protocol = { workspace = true }
bytes = { workspace = true }
felis-vt = { workspace = true }
regex = { workspace = true }
bitflags = { workspace = true }
foldhash = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }
unicode-width = { workspace = true }
simdutf8 = { workspace = true }

# The page-backed cell storage (`src/paged_cells.rs`) maps, commits
# and discards its pages itself.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

# Per-page working-set queries for the storage tests.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[[bench]]
name = "damage_merge"
harness = false

[[bench]]
name = "scroll_region"
harness = false

[[bench]]
name = "unicode_throughput"
harness = false

[[bench]]
name = "ascii_throughput"
harness = false

[[bench]]
name = "csi_dispatch"
harness = false

[[bench]]
name = "erase"
harness = false

[[bench]]
name = "kitty_apc"
harness = false

[lints]
workspace = true
