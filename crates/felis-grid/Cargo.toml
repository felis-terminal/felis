[package]
name = "felis-grid"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis grid model: cells, cursor, scrollback, image store, damage tracker"

[features]
# Derives the row DTO's JSON Schema for the documents that embed it;
# default-off so the shipped binaries stay schemars-free.
schema = ["dep:schemars"]
# Serde for the state an in-place daemon upgrade carries across exec;
# only the daemon enables it.
state-dump = ["felis-vt/state-dump"]

[dependencies]
felis-protocol = { workspace = true }
bytes = { workspace = true }
felis-vt = { workspace = true }
regex = { workspace = true }
bitflags = { workspace = true }
foldhash = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }
unicode-width = { workspace = true }
simdutf8 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[[bench]]
name = "damage_merge"
harness = false

[[bench]]
name = "scroll_region"
harness = false

[[bench]]
name = "unicode_throughput"
harness = false

[[bench]]
name = "ascii_throughput"
harness = false

[[bench]]
name = "csi_dispatch"
harness = false

[lints]
workspace = true
