[package]
name = "felis-pty"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hosted async PTY layer (openpty on Unix, ConPTY on Windows)"

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# libc for tcgetpgrp: rustix's wrapper asserts pgid > 0, failing on a dead session leader.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "pipe", "termios"] }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util", "time"] }
felis-vt = { workspace = true }
felis-grid = { workspace = true }

[lints]
workspace = true
