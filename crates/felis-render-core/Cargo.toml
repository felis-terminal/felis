[package]
name = "felis-render-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis renderer-neutral core: palette, cell appearance, box drawing, glyph index, shelf atlas, cell painter and its display list"

[features]
default = ["glyphs"]
# Gates the modules that rasterize through felis-shaping, so a wasm32 client links the palette and display-list types
# without it; a wasm arm in felis-shaping would pull a font stack it has no provider for.
glyphs = ["dep:felis-shaping", "dep:foldhash"]
# Test-only support, outside the semver contract.
# Named testing over test-support because clippy::redundant_feature_names rejects the -support suffix.
testing = ["glyphs"]

[dependencies]
felis-protocol = { workspace = true }
felis-grid = { workspace = true }
felis-shaping = { workspace = true, optional = true }
foldhash = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
felis-shaping = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
felis-vt = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "atlas"
harness = false
required-features = ["glyphs"]

[[bench]]
name = "shape_memo"
harness = false
required-features = ["glyphs"]

[lints]
workspace = true
