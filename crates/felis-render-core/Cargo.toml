[package]
name = "felis-render-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "felis renderer-neutral core: palette, box drawing, glyph index, shelf atlas, cell painter and its display list"

[features]
# Named testing over test-support because clippy::redundant_feature_names rejects the -support suffix.
testing = []

[dependencies]
felis-protocol = { workspace = true }
felis-grid = { workspace = true }
felis-shaping = { workspace = true }
foldhash = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
felis-shaping = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
felis-vt = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "atlas"
harness = false

[[bench]]
name = "shape_memo"
harness = false

[lints]
workspace = true
