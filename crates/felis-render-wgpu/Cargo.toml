[package]
name = "felis-render-wgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis wgpu renderer: pipeline, instance encoding, glyph and image atlas textures, decoration shader"

[dependencies]
felis-protocol = { workspace = true }
felis-grid = { workspace = true }
felis-shaping = { workspace = true }
felis-render-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
raw-window-handle = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
felis-shaping = { path = "../felis-shaping", features = ["testing"] }
felis-render-core = { path = "../felis-render-core", features = ["testing"] }
proptest = { workspace = true }
felis-vt = { path = "../felis-vt" }
criterion = { workspace = true }
wgpu = { workspace = true, features = ["noop"] }

[[bench]]
name = "paint_frame"
harness = false

[[bench]]
name = "video_frame"
harness = false

[lints]
workspace = true
