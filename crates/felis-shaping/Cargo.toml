[package]
name = "felis-shaping"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis text shaper: swash + font fallback + shape cache"

[features]
# Test-only support, outside the semver contract.
# Named testing over test-support because clippy::redundant_feature_names rejects the -support suffix.
testing = []

[dependencies]
swash = { workspace = true }
skrifa = { workspace = true }
zeno = { workspace = true }
memmap2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFCGTypes",
  "CFDictionary",
  "CFURL",
] }
objc2-core-text = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
unicode-width = { workspace = true }

# The fontconfig provider's tests also run on other Unix hosts that have
# libfontconfig, so it is checked outside Linux.
[target.'cfg(unix)'.dev-dependencies]
yeslogic-fontconfig-sys = { workspace = true }

[[bench]]
name = "shape_cache"
harness = false

[[bench]]
name = "shape_run"
harness = false

[lints]
workspace = true
