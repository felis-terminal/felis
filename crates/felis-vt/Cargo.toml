[package]
name = "felis-vt"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "felis VT parser: Williams DFA with UTF-8 buffering"

[features]
# Serde for the state an in-place daemon upgrade carries across exec;
# only the daemon enables it.
state-dump = ["dep:serde", "dep:base64"]

[dependencies]
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "parser_throughput"
harness = false

[lints]
workspace = true
