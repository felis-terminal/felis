[graph]
# The crate-map `wrappers` below must see optional edges too, the same scope tools/dep_bans.py checks.
all-features = true

[advisories]
yanked = "deny"
# Scoped to workspace: transitive unmaintained deps cannot be updated from this repository.
unmaintained = "workspace"

[licenses]
# Strict allowlist over blanket OSI approval so new license categories require explicit review.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # MPL-2.0 copyleft is file-scoped and does not extend to the consuming binary.
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
wildcards = "deny"
# Required because workspace-inheritance dependencies read as wildcards in member manifests.
allow-wildcard-paths = true
# Runtime evaluators are intentionally excluded; extension is IPC-based.
deny = [
  # GPU, windowing and shaping crates, each admitted only as a direct
  # dependency of the crate that owns it (docs/reference/workspace.md "Crate map").
  { crate = "wgpu", wrappers = [
    "felis-render-wgpu",
  ], reason = "only felis-render-wgpu talks to the GPU" },
  { crate = "winit", wrappers = [
    "felis-client",
  ], reason = "only felis-client owns a window" },
  { crate = "swash", wrappers = [
    "felis-shaping",
  ], reason = "only felis-shaping shapes text" },
  # The crate map (docs/reference/workspace.md "Crate map"): each felis-*
  # library is admitted only as a direct dependency of the rows that list it.
  # Parents after `# dev` are dev-dependency edges, which cargo-deny's graph
  # includes; promoting one to a normal edge passes here.
  { crate = "felis-protocol", wrappers = [
    "felis-vt",
    "felis-grid",
    "felis-transport",
    "felis-daemon",
    "felis-client-core",
    "felis-render-core",
    "felis-render-wgpu",
    "felis-cli",
    "felis-client",
  ], reason = "edge not in the crate map" },
  { crate = "felis-vt", wrappers = [
    "felis-grid",
    "felis-daemon",
    # dev
    "felis-client-core",
    "felis-pty",
    "felis-render-core",
    "felis-render-wgpu",
  ], reason = "edge not in the crate map" },
  { crate = "felis-grid", wrappers = [
    "felis-daemon",
    "felis-client-core",
    "felis-render-core",
    "felis-render-wgpu",
    "felis-cli",
    "felis-client",
    # dev
    "felis-pty",
  ], reason = "edge not in the crate map" },
  { crate = "felis-pty", wrappers = [
    "felis-daemon",
    # dev
    "felis-cli",
    "felis-client-core",
  ], reason = "edge not in the crate map" },
  { crate = "felis-transport", wrappers = [
    "felis-daemon",
    "felis-client-core",
    "felis-cli",
    "felis-client",
  ], reason = "edge not in the crate map" },
  { crate = "felis-daemon", wrappers = [
    # dev
    "felis-cli",
    "felis-client-core",
  ], reason = "edge not in the crate map" },
  { crate = "felis-client-core", wrappers = [
    "felis-cli",
    "felis-client",
    # dev
    "felis-daemon",
  ], reason = "edge not in the crate map" },
  { crate = "felis-shaping", wrappers = [
    "felis-render-core",
    "felis-render-wgpu",
  ], reason = "edge not in the crate map" },
  { crate = "felis-render-core", wrappers = [
    "felis-render-wgpu",
    "felis-client",
  ], reason = "edge not in the crate map" },
  { crate = "felis-render-wgpu", wrappers = [
    "felis-client",
  ], reason = "edge not in the crate map" },
  # Lua bindings and runtimes.
  "mlua",
  "rlua",
  "hlua",
  "lua",
  "lua-src",
  "lua52-sys",
  "lua53-sys",
  "lua54-sys",
  "luajit-src",
  "luajit-sys",
  "tealr",
  # Python bindings and runtimes.
  "pyo3",
  "pyo3-build-config",
  "pyo3-ffi",
  "cpython",
  "rust-cpython",
  "rustpython-vm",
  "rustpython-compiler",
  # Wasm runtimes.
  "wasmtime",
  "wasmer",
  "wasmer-runtime",
  "wasmer-runtime-core",
  "wasmi",
  "wasm3",
  "wapc",
  "wasmer-vm",
  "wasmtime-runtime",
  "wasmtime-cranelift",
  # JavaScript and ECMAScript engines.
  "deno_core",
  "deno_runtime",
  "rusty_v8",
  "v8",
  "quickjs",
  "rquickjs",
  "rquickjs-core",
  "boa_engine",
  "boa_interpreter",
  # Other embedded scripting languages.
  "rhai",
  "rhai_codegen",
  "gluon",
  "steel-core",
  "steel-language-server",
  "ketos",
  "dyon",
  "tcl",
  "duktape",
  "duktape-sys",
  # Generic dynamic-evaluation surfaces.
  "evalexpr",
  "fasteval",
]
